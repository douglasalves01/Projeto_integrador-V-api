[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vod-analytics"
version = "0.1.0"
description = "Jobs analiticos e relatorios da plataforma VOD"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.25",
    "psycopg[binary]>=3.1.18",
    "pandas>=2.1.0",
    "pyarrow>=15.0.0",
    "matplotlib>=3.8.0",
    "click>=8.1.7",
    "pydantic-settings>=2.5.2",
]
